[package]
name = "ticklore-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "The server half of ticklore: runs an authoritative world and serves per-client views over TCP."
readme = "README.md"
license = "MIT"
repository = "https://github.com/lukejoshuapark/ticklore"
keywords = ["gamedev", "networking", "multiplayer", "server", "tcp"]
categories = ["game-development", "network-programming"]

[lib]
path = "lib.rs"

[dependencies]
ticklore = { version = "0.1.0", path = "../ticklore" }

bincode = "1.3.3"
serde = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
