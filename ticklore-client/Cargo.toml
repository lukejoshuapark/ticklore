[package]
name = "ticklore-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "The client half of ticklore: connects to a ticklore server and drives a raylib render loop."
readme = "README.md"
license = "MIT"
repository = "https://github.com/lukejoshuapark/ticklore"
keywords = ["gamedev", "networking", "multiplayer", "client", "raylib"]
categories = ["game-development", "network-programming"]

[lib]
path = "lib.rs"

[dependencies]
ticklore = { version = "0.1.0", path = "../ticklore" }

bincode = "1.3.3"
raylib = "6"
serde = "1"
thiserror = "2"
